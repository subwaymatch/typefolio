name: Checks

# Runs the full suite against the checkout. There is no build step, so what is
# tested here is byte-for-byte what Cloudflare Pages will serve.
#
# Make this a required check in Settings -> Branches to gate merges on it.

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Markup, headers, accessibility, behaviour, render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium. The suite does not need the other engines, and this is
      # the slowest step by far.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checks
        id: checks
        run: npm test 2>&1 | tee /tmp/checks.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Results"
            echo
            echo '```'
            grep -E '^(markup|headers|a11y|behavior|render):|^  FAIL' /tmp/checks.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Report on the pull request
    needs: checks
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ needs.checks.result }}' === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- typefolio-checks -->';
            const body = [
              marker,
              passed
                ? '### Checks passed'
                : '### Checks failed',
              '',
              passed
                ? 'Markup, CSP, accessibility, behaviour and render checks are all green.'
                : `Something regressed. [Full output](${run}).`,
              '',
              '| Suite | Covers |',
              '| --- | --- |',
              '| markup | tag balance, local links, duplicate ids, image dimensions and alt |',
              '| headers | the CSP in `_headers` enforced in a real browser on every page |',
              '| a11y | axe-core, every page, two viewports, light and dark |',
              '| behavior | menu, keyboard dropdowns, slider controls, sticky sidebar |',
              '| render | every page at eight widths in both themes |',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
